<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cal edits | portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Limelight&family=Open+Sans&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <style>
    :root{--plyr-color-main:#e2231a}
    .video{line-height:normal;background:#000}
    .video .plyr,.video .plyr__video-wrapper{height:100%;width:100%}
    .video video{width:100%;height:100%;object-fit:contain}
    .txt{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
    .txt.m{display:none}
    .gato{position:absolute;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
    .gato.g-m{display:none}
    .gato:hover,.gato.hop{animation:hop .5s cubic-bezier(.3,.7,.4,1)}
    @keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-5%) scale(1.04)}65%{transform:translateY(0) scale(1)}80%{transform:translateY(-1.5%)}100%{transform:translateY(0)}}

    @keyframes zoomOut{from{transform:scale(1.14)}to{transform:scale(1)}}
    .tela{animation:zoomOut .8s cubic-bezier(.16,.8,.3,1) backwards;transform-origin:50% 0}
    @media (prefers-reduced-motion:reduce){.tela{animation:none}}

    /* ---- Bounce individual dos elementos (o gato tem o dele, com miau) ---- */
    .txt{pointer-events:none}
    .txt.pc{--j:26px}
    .txt.m{--j:30px}
    .hit{pointer-events:auto}
    .bn{pointer-events:none;transform-box:fill-box;transform-origin:50% 100%}
    .hit:hover .bn,.hit.hop .bn{animation:bn .5s cubic-bezier(.3,.7,.4,1)}
    @keyframes bn{
      0%{transform:translateY(0) scale(1)}
      35%{transform:translateY(calc(var(--j) * -1)) scale(1.04)}
      65%{transform:translateY(0) scale(1)}
      80%{transform:translateY(calc(var(--j) * -.3))}
      100%{transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){.hit:hover .bn,.hit.hop .bn{animation:none}}

    /* Evita que o bounce corte o topo dos elementos */
    .tela{padding-top:40px;margin-top:-40px}

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: #261b1d; }

    /* Caixa que segura a imagem e os vídeos por cima */
    .pagina {
      width: 100%;
      overflow: hidden;
      line-height: 0;
      padding-top: 60px;
      margin-top: -60px;
    }

    /* Versão PC: a imagem fica maior que a tela e centralizada na coluna branca,
       então as laterais escuras/vermelhas são cortadas como no seu recorte. */
    .tela {
      position: relative;
      width: 155.63%;
      margin-left: -25.21%;
    }

    .tela img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Vídeos: posição em % em relação à imagem (versão PC) */
    .video {
      position: absolute;
      border: 0;
    }
    .video.v1 { left: 35.322%; top: 35.28%;  width: 24.799%; height: 16.224%; }
    .video.v2 { left: 35.322%; top: 55.575%; width: 24.799%; height: 16.224%; }

    /* Versão celular */
    @media (max-width: 768px) {
      .txt.pc{display:none} .txt.m{display:block} .gato.g-pc{display:none} .gato.g-m{display:block}
      .tela { width: 100%; margin-left: 0; }
      .video.v1 { left: 10.552%; top: 41.013%; width: 78.654%; height: 17.6%; }
      .video.v2 { left: 9.915%;  top: 62.35%;  width: 78.684%; height: 17.6%; }
    }
  </style>

<script>
const miau=new Audio('miau.mp3');
document.querySelectorAll('.gato').forEach(g=>{
  g.addEventListener('click',()=>{miau.currentTime=0;miau.play().catch(()=>{});g.classList.remove('hop');void g.offsetWidth;g.classList.add('hop')});
  g.addEventListener('animationend',()=>g.classList.remove('hop'));
});
</script>
<script>
/* toque no celular: faz o bounce do elemento tocado (sem som; o miau é só do gato) */
document.querySelectorAll('.hit').forEach(h=>{
  h.addEventListener('click',()=>{
    h.classList.remove('hop');
    void h.getBoundingClientRect();
    h.classList.add('hop');
    clearTimeout(h._bnT);
    h._bnT=setTimeout(()=>h.classList.remove('hop'),500);
  });
});
</script>
